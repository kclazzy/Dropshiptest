<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Dropship</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #1b1f24; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .status { padding: 6px 8px; border-radius: 6px; margin-bottom: 10px; background: #fde8e8; }
    .status.ok { background: #e3f6e8; }
    label { display: block; margin: 8px 0 2px; font-size: 12px; color: #555; }
    input { width: 100%; box-sizing: border-box; padding: 5px; }
    button { margin-top: 8px; padding: 7px 10px; width: 100%; cursor: pointer; }
    button.primary { background: #1a73e8; color: #fff; border: 0; border-radius: 6px; }
    #message { margin-top: 10px; min-height: 18px; white-space: pre-wrap; }
    #message.error { color: #b3261e; }
    details { margin-top: 12px; }
    #orders { margin-top: 12px; }
    .order { border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 13px; }
    .order .st { font-weight: 600; }
    .order pre { margin: 6px 0; white-space: pre-wrap; background: #f6f8fa; padding: 4px; }
    .order .row { display: flex; gap: 4px; margin-top: 4px; }
    .order .row button { margin-top: 0; width: auto; }
    .order .note { color: #b3261e; margin-top: 4px; }
    #update { margin-top: 12px; padding: 8px; background: #fff4d6; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Dropship</h1>
  <div id="status" class="status">Проверяю связь с ядром…</div>
  <button id="import" class="primary">Добавить товар с этой страницы</button>
  <button id="cookies">Передать сессию сайта в ядро</button>
  <div id="message"></div>
  <details id="orders-box" open>
    <summary>Заказы покупателей</summary>
    <div id="orders"></div>
    <button id="orders-refresh">Обновить список</button>
  </details>
  <div id="update" hidden>
    <span id="update-text"></span>
    <button id="update-apply" class="primary">Обновить в один клик</button>
  </div>
  <details id="settings">
    <summary>Настройки</summary>
    <label for="code">Код привязки (из приложения: Настройки → Расширение)</label>
    <input id="code" type="text" maxlength="8" autocomplete="off" spellcheck="false">
    <button id="pair" class="primary">Привязать</button>
    <label for="store">Номер магазина (необязательно)</label>
    <input id="store" type="number" min="1">
    <button id="save">Сохранить</button>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>
