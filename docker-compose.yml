# Запуск на VPS:  docker compose up -d --build
# network_mode: host нужен, чтобы loopback-порт ядра был доступен SSH-туннелю на самом сервере.
# Ключи облачных ИИ кладутся в .env (см. docs/CLOUD.md) и в репозиторий не попадают.
services:
  core:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - dropship-data:/data
volumes:
  dropship-data:
