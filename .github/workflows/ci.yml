name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev libssl-dev libcurl4-openssl-dev libboost-dev nlohmann-json3-dev
      - run: cmake -S core-cpp -B build -G Ninja && cmake --build build && ./build/dropship_tests
  extension:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: extension-mv3 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run typecheck && npm test && npm run build
