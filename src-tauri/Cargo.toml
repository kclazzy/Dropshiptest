[package]
name = "dropship"
version = "0.1.0"
description = "Локальная гибридная система автоматизации дропшиппинга и ресейла"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
name = "dropship_lib"
crate-type = ["rlib"]

[[bin]]
name = "dropship"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10.3"
aho-corasick = "1.1.5"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
dashmap = "6.2.1"
governor = "0.10.4"
quick-xml = "0.41.0"
reqwest = { version = "0.13.3", default-features = false, features = ["form", "json", "rustls"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = "0.29.0"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"
